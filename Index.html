<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="icon" href="icon.ico">

</head>

    <main>
        <article>
            <a href="https://github.com">

            <a href="https://www.youtube.com/">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube Logo">
            </a>
            <a href="https://www.reddit.com/">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Reddit Logo">   
            </a>
            <a href="https://www.instagram.com/">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384063.png" alt="Instagram Logo">
            </a>
        </article>
        <footer>
            <p>© 2024 StandBy Dashboard. All rights reserved.</p>
        </footer>

</html>
